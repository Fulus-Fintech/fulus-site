name: checks

on:
  push:
  pull_request:

# Read-only, whatever the repository default says: nothing here writes to
# GitHub (checkout only reads; the npm cache and the artifact upload use the
# runner's own token).
permissions:
  contents: read

jobs:
  # `gates` is the REQUIRED status check on `main` (branch protection, pinned
  # to GitHub Actions). Renaming this job, giving it a `name:`, or making it a
  # matrix renames the check, and every PR then waits forever for a `gates`
  # that never reports: change the protection in the same sitting. Never
  # filter `on:` above by paths or branches either; a workflow that doesn't
  # run leaves the check pending.
  gates:
    # Visual baselines are committed for chromium-win32; CI stays on Windows
    # so toHaveScreenshot compares against them (governance note at the top
    # of tests/e2e/visual.spec.ts — baselines change only with a
    # founder-approval reference in the commit message).
    runs-on: windows-latest
    # A run takes about 7 minutes. Without this, a hung step would block
    # every merge for GitHub's default of 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: install
        run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: build
        run: npm run build
      - name: unit tests (vitest)
        run: npx vitest run
      - name: bundle budget — critical 350 KB gz (Three.js included)
        run: node tools/check_bundle_budget.mjs
      - name: bundle budget — poster edition 700 KB
        run: node tools/check_bundle_budget.mjs --poster
      - name: html-validate (built output)
        run: npx html-validate dist/index.html dist/privacy.html
      - name: internal links + asset existence (built output)
        run: node tools/check_links.mjs --root dist
      - name: .well-known integrity
        run: node tools/check_wellknown.mjs
      - name: install playwright chromium
        run: npx playwright install --with-deps chromium
      # Runs document/copy-lock, a11y, keyboard, the world boot smoke and the
      # poster-edition visual baselines. It does NOT run the redirect suite:
      # those specs need a worker on :8787 and auto-skip without DOORS_MODE,
      # so they get their own two steps below. WebGL frame quality is NEVER
      # pixel-gated here (spec §7 — SwiftShader lesson); it is reviewed by
      # eye via tools/qa_shots.mjs and at the founder gates.
      - name: e2e (playwright)
        run: npx playwright test
      # The doors / redirect / POST /e contract against the REAL worker
      # (src/worker.ts) under `wrangler dev` — the vite preview server the
      # step above uses never executes it. Two passes because the doors flip
      # is a var flip: A = doors forced shut (--var DOORS:pre; wrangler.jsonc
      # itself ships DOORS=open since the launch, so its defaults are no longer
      # "pre"), B = the launch vars (open) with test store ids.
      # tests/unit/worker.test.ts pins the same table at unit level;
      # these steps prove the worker as deployed actually behaves that way.
      - name: e2e redirects — doors pre (wrangler dev)
        shell: pwsh
        env:
          DOORS_MODE: pre
        run: ./.github/scripts/redirect-suite.ps1 --var DOORS:pre
      - name: e2e redirects — doors open (wrangler dev)
        shell: pwsh
        env:
          DOORS_MODE: open
        run: ./.github/scripts/redirect-suite.ps1 --var DOORS:open --var APP_STORE_ID:6742000000 --var PLAY_PACKAGE_ID:sa.fulus.app
      - name: upload playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
