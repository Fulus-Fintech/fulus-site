<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fulus OG image (dev render source — screenshot at 1200x630)</title>
<style>
  @font-face {
    font-family: 'Readex Pro';
    src: url('../assets/fonts/readex-pro-latin.woff2') format('woff2');
    font-weight: 400 700;
    font-display: block;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #020B18;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    font-family: 'Readex Pro', sans-serif;
    position: relative;
  }
  .halo {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 900px 500px at 50% 42%, rgba(0, 229, 255, 0.14), transparent 70%);
  }
  .lockup { width: 640px; height: auto; position: relative; }
  .tagline {
    position: relative;
    color: #7A8AA0;
    font-size: 34px;
    font-weight: 400;
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
  <div class="halo"></div>
  <img class="lockup" src="../../fulus-brand/assets/logos/png/logo-horizontal-bilingual-white.png" alt="">
  <p class="tagline">Invest together. Grow together.</p>
</body>
</html>
