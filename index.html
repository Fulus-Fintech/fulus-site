<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="meta.title">Fulus — Where your circle invests</title>
  <meta name="description" data-i18n="meta.description" data-i18n-attr="content"
        content="Fulus is the app for families and friends in Saudi Arabia and the Gulf who invest together — pooled contributions, recorded votes, exact ownership, clean settlements. Private beta, now onboarding.">
  <meta name="theme-color" content="#020B18">
  <link rel="canonical" href="https://fulus.sa/">

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicons/favicon-16.png">
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Fulus">
  <meta property="og:url" content="https://fulus.sa/">
  <meta property="og:title" data-i18n="meta.title" data-i18n-attr="content" content="Fulus — Where your circle invests">
  <meta property="og:description" data-i18n="meta.description" data-i18n-attr="content"
        content="Fulus is the app for families and friends in Saudi Arabia and the Gulf who invest together — pooled contributions, recorded votes, exact ownership, clean settlements. Private beta, now onboarding.">
  <meta property="og:image" content="https://fulus.sa/assets/images/og-image.png">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="ar_SA">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://fulus.sa/assets/images/og-image.png">

  <link rel="preload" href="/assets/fonts/readex-pro-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/readex-pro-arabic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">

  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js" integrity="sha384-HOvlOYPIs/zjoIkWUGXkVmXsjr8GuZLV+Q+rcPwmJOVZVpvTSXQChiN4t9Euv9Vc" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js" integrity="sha384-P8VzCVnT9NBUkMrpcIZrJbA7EBjJvh/fJS6PmP+4nLIM284DtsImIv8D0fFjIkeh" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/SplitText.min.js" integrity="sha384-xb96EMJeax+NLXMC88ZBa1xAeAW+kn+horHh/zFlbMLG2UPWhMJJSlv7fi57hS+Q" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://challenges.cloudflare.com/turnstile/api.js?render=explicit" async defer></script>
</head>
<body>
  <a href="#main" class="skip-link" data-i18n="a11y.skip">Skip to content</a>

  <svg hidden id="icon-sprite" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="portal-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#00E5FF"/>
        <stop offset="1" stop-color="#00FFB2"/>
      </linearGradient>
    </defs>
    <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></symbol>
    <symbol id="icon-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6M16 11a3 3 0 1 0 0-6M22 20c0-2.5-2-4.5-4-5"/></symbol>
    <symbol id="icon-wallet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 14h2"/></symbol>
    <symbol id="icon-trending" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M14 7h7v7"/></symbol>
    <symbol id="icon-receipt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v18l3-2 3 2 3-2 3 2 3-2V3zM8 8h8M8 12h8M8 16h5"/></symbol>
    <symbol id="icon-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="icon-key" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="14" r="4"/><path d="M11 11l9-9M16 6l3 3M19 3l2 2"/></symbol>
    <symbol id="icon-cash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="12" rx="1.5"/><circle cx="12" cy="13" r="2.5"/><path d="M5 10v6M19 10v6"/></symbol>
  </svg>

  <header id="site-header">
    <div class="container header-inner">
      <a class="header-logo" href="/" aria-label="Fulus — home" data-i18n="a11y.home" data-i18n-attr="aria-label">
        <img src="/assets/images/logo-horizontal-bilingual-white.png" alt="" width="180" height="40" decoding="async">
      </a>
      <div class="header-actions">
        <div class="lang-toggle" role="group" aria-label="Language" data-i18n="a11y.lang" data-i18n-attr="aria-label">
          <button type="button" class="lang-btn" data-lang="en" aria-pressed="false" lang="en">English</button>
          <button type="button" class="lang-btn" data-lang="ar" aria-pressed="false" lang="ar">العربية</button>
        </div>
        <a class="btn btn--outline" href="#hero" data-i18n="header.cta">Join the Waitlist</a>
      </div>
    </div>
  </header>

  <main id="main">
    <section id="hero">
      <div class="container hero-grid">
        <div id="hero-panel">
          <p class="hero-eyebrow" data-i18n="hero.beta">Private beta — now onboarding.</p>
          <h1 class="hero-head" data-split data-i18n="hero.head">Where your circle invests.</h1>
          <p class="hero-sub" data-i18n="hero.sub">Fulus runs the money side for families and friends who invest together in Saudi Arabia and the Gulf.</p>
          <form class="waitlist-form" data-form="hero" novalidate>
            <label class="visually-hidden" for="email-hero" data-i18n="a11y.email.label">Email address</label>
            <input class="input" type="email" name="email" id="email-hero" autocomplete="email" inputmode="email" required dir="ltr" placeholder="name@email.com">
            <button class="btn btn--hero" type="submit" data-i18n="form.cta">Save My Spot</button>
            <p class="form-msg" aria-live="polite"></p>
            <div class="turnstile-slot"></div>
          </form>
          <p class="hero-microcopy"><svg class="icon" aria-hidden="true"><use href="#icon-key"/></svg> <span data-i18n="hero.form.note">No spam — launch updates only.</span></p>
        </div>
        <div class="hero-visual">
          <div class="hero-halo" aria-hidden="true"></div>
          <div class="portal portal--hero is-invitation">
            <svg class="portal-svg" viewBox="0 0 72.12 93.68" aria-hidden="true"><polygon points="72.12 0 0 26.48 0 93.68 72.12 67.2" fill="url(#portal-grad)"/></svg>
            <img class="portal-window"
                 src="/assets/images/hero-dashboard.webp"
                 srcset="/assets/images/hero-dashboard.webp 1x, /assets/images/hero-dashboard@2x.webp 2x"
                 alt="The Fulus club dashboard seen through the Fulus portal — Noor Family Club, balances and a live vote"
                 data-i18n="a11y.hero.alt" data-i18n-attr="alt"
                 width="621" height="1344" loading="eager" fetchpriority="high" decoding="async">
          </div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
