<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>world dev harness — flight</title>
<style>
  @font-face { font-family:'Readex Pro'; src:url('/assets/fonts/readex-pro-latin.woff2') format('woff2'); font-weight:300 700; font-display:swap; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#020B18; color:#F2F5F8; font-family:'Readex Pro',system-ui,sans-serif; }
  #scrollspace { height:680vh; }
  #gl { position:fixed; inset:0; z-index:1; }
  #wash { position:fixed; inset:0; z-index:15; pointer-events:none; opacity:0;
    background:radial-gradient(60% 60% at 50% 46%, #ECFFFE 0%, #BDF6FF 55%, rgba(189,246,255,.6) 100%); }
  .ui { position:fixed; z-index:10; }
  #nav { top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center; padding:18px clamp(18px,4vw,44px); }
  .wordmark { font-weight:700; letter-spacing:.38em; font-size:.95rem; }
  #meter { display:flex; align-items:center; gap:10px; font-family:monospace; font-size:9px; letter-spacing:.22em; color:rgba(242,245,248,.45); }
  #mbar { width:110px; height:2px; background:rgba(242,245,248,.12); border-radius:2px; overflow:hidden; }
  #mfill { height:100%; width:0%; background:linear-gradient(90deg,#00E5FF,#00FFB2); }
  .beat { position:fixed; left:50%; transform:translateX(-50%); text-align:center; z-index:10; opacity:0; transition:opacity .5s ease; pointer-events:none; }
  .beat.on { opacity:1; pointer-events:auto; }
  #beat-hero { top:16%; }
  #beat-hero h1 { font-size:clamp(2.2rem,5.6vw,4rem); font-weight:650; letter-spacing:-.015em; color:#E6F7FB; line-height:1.12; text-shadow:0 2px 30px rgba(2,11,24,.9); }
  #beat-hero p { margin-top:12px; font-size:clamp(.95rem,2vw,1.15rem); font-weight:300; color:#C7D1DB; }
  #beat-hero .hint { margin-top:22px; font-family:monospace; font-size:10px; letter-spacing:.28em; color:rgba(242,245,248,.45); }
  #beat-mid { top:20%; }
  #beat-mid p { font-size:clamp(1.3rem,3.2vw,2rem); font-weight:400; color:#E6F7FB; text-shadow:0 2px 30px rgba(2,11,24,.9); }
  #beat-open { top:14%; }
  #beat-open p { font-size:clamp(2rem,5vw,3.4rem); font-weight:650; color:#E6F7FB; text-shadow:0 0 40px rgba(0,229,255,.3); }
  #beat-end { bottom:12%; }
  #beat-end h2 { font-size:clamp(2rem,5vw,3.4rem); font-weight:650; color:#E6F7FB; margin-bottom:26px; text-shadow:0 0 40px rgba(0,229,255,.25); }
  #beat-end .badges { display:flex; gap:14px; justify-content:center; }
  .badge { display:flex; align-items:center; gap:10px; background:#000; border:1px solid rgba(242,245,248,.3); border-radius:9px; padding:10px 18px; color:inherit; text-decoration:none; }
  .badge small { display:block; font-size:9px; color:rgba(242,245,248,.7); text-align:left; }
  .badge strong { display:block; font-size:13px; font-weight:500; text-align:left; }
  #beat-end .sig { margin-top:18px; font-size:.95rem; font-weight:300; color:#C7D1DB; text-shadow:0 2px 20px rgba(2,11,24,.9); }
</style>
</head>
<body>
<div id="scrollspace"></div>
<canvas id="gl"></canvas>
<div id="wash"></div>

<div class="ui" id="nav"><div class="wordmark">FULUS</div>
  <div id="meter"><span>THE WAY IN</span><div id="mbar"><div id="mfill"></div></div></div></div>

<div class="beat on" id="beat-hero">
  <h1>The group chat,<br>now invested.</h1>
  <p>Group investing for the circle you already have.</p>
  <div class="hint">SCROLL</div>
</div>
<div class="beat" id="beat-mid"><p>One pot. Real votes. Everyone sees everything.</p></div>
<div class="beat" id="beat-open"><p>It’s open.</p></div>
<div class="beat" id="beat-end">
  <h2>Walk in.</h2>
  <div class="badges">
    <a class="badge" href="/app/ios" aria-label="Download Fulus on the App Store"><div><small>Download on the</small><strong>App Store</strong></div></a>
    <a class="badge" href="/app/android" aria-label="Get Fulus on Google Play"><div><small>GET IT ON</small><strong>Google Play</strong></div></a>
  </div>
  <p class="sig">The group chat, now invested.</p>
</div>
<script type="module" src="/dev/world.ts"></script>
</body>
</html>
